name: Post-deploy SEO smoke

on:
  workflow_run:
    workflows: ["verify"]
    types: [completed]

permissions:
  contents: read
  checks: read

jobs:
  production-smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wait for the exact Cloudflare deployment, then verify Googlebot HTML
        env:
          SITE_ORIGIN: "https://ip.digdevbox.com"
          LANDING_PATH: "/ip-geolocation/"
          EXPECTED_TITLE: "IP Geolocation Lookup"
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const origin = process.env.SITE_ORIGIN;
          const landingPath = process.env.LANDING_PATH;
          const expectedTitle = process.env.EXPECTED_TITLE;
          const targetSha = process.env.TARGET_SHA;
          const ua = 'Googlebot/2.1 (+http://www.google.com/bot.html)';
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function get(path) {
            const response = await fetch(origin + path, {
              redirect: 'follow',
              headers: { 'user-agent': ua, 'cache-control': 'no-cache' },
              signal: AbortSignal.timeout(10000),
            });
            return { response, body: await response.text() };
          }

          // A successful smoke test must never race ahead of the Pages deployment.
          // Match the Cloudflare check run to this workflow's exact source commit.
          const checksUrl = 'https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY +
            '/commits/' + targetSha + '/check-runs';
          let deployed = false;
          for (let attempt = 1; attempt <= 90; attempt++) {
            const response = await fetch(checksUrl, {
              headers: {
                authorization: 'Bearer ' + process.env.GITHUB_TOKEN,
                accept: 'application/vnd.github+json',
                'x-github-api-version': '2022-11-28',
              },
              signal: AbortSignal.timeout(10000),
            });
            if (!response.ok) throw new Error('GitHub check-run API returned HTTP ' + response.status);
            const payload = await response.json();
            const check = (payload.check_runs || []).find((item) =>
              item.name === 'Cloudflare Pages' && item.head_sha === targetSha
            );
            if (check?.status === 'completed') {
              if (check.conclusion !== 'success') {
                throw new Error('Cloudflare Pages deployment concluded ' + check.conclusion +
                  ': ' + (check.details_url || 'no details URL'));
              }
              deployed = true;
              console.log('Cloudflare Pages deployment succeeded for exact commit ' + targetSha);
              break;
            }
            console.log('Waiting for exact Cloudflare deployment (' + attempt + '/90): ' +
              (check?.status || 'check not created'));
            await sleep(10000);
          }
          if (!deployed) throw new Error('Exact Cloudflare Pages deployment did not complete within 15 minutes');

          let home = null;
          for (let attempt = 1; attempt <= 20; attempt++) {
            try {
              const result = await get('/');
              const title = result.body.match(/<title[^>]*>([\s\S]*?)<\/title>/i)?.[1] || '';
              if (result.response.ok && result.body.includes('<html lang="en"') && title.includes(expectedTitle)) {
                home = result;
                console.log('Googlebot received the expected English homepage (attempt ' + attempt + ')');
                break;
              }
              console.log('Waiting for production HTML (' + attempt + '/20): HTTP ' +
                result.response.status + ', title="' + title + '"');
            } catch (error) {
              console.log('Waiting for production origin (' + attempt + '/20): ' + error.message);
            }
            await sleep(10000);
          }
          if (!home) throw new Error('Production homepage did not expose expected English HTML after exact deployment');

          if (!home.body.includes('/analytics-consent.js')) throw new Error('Production homepage is missing the GA4 consent loader');
          const gaScript = await get('/analytics-consent.js');
          if (!gaScript.response.ok || !gaScript.body.includes('G-6H3Z1K9R7P') ||
              !gaScript.body.includes("analytics_storage: 'denied'") ||
              !gaScript.body.includes('send_page_view: false') ||
              !gaScript.body.includes('Reject Google Analytics')) {
            throw new Error('Production IP Locator GA4 loader is missing, misconfigured or not consent-gated');
          }
          const privacyPage = await get('/privacy');
          if (!privacyPage.response.ok || !privacyPage.body.includes('Google Analytics 4') ||
              !privacyPage.body.includes('metrics.digdevbox.com') ||
              !privacyPage.body.includes('不会发出 GA4 请求')) {
            throw new Error('Production IP Locator privacy page is missing GA4 and first-party metrics disclosures');
          }



          if (!home.body.includes('>🌍 IP Geolocation Lookup</h1>')) throw new Error('English IP lookup H1 missing from source HTML');
          if (!home.body.includes('<title>IP Geolocation Lookup — IP Address, ASN &amp; DNS | DigDevBox</title>')) throw new Error('IP lookup title snippet is not the concise search-target version');
          if (!home.body.includes('Look up public IPv4 and IPv6 addresses by location, ISP and ASN. Check CIDR subnets plus DNS and reverse DNS records')) throw new Error('IP lookup meta description is missing the concise search-intent summary');
          if (!home.body.includes('Look up detailed geolocation info for any IP address')) throw new Error('English IP lookup hero description missing from source HTML');
          if (!home.body.includes('content="IP Geolocation Lookup"')) throw new Error('English Open Graph site name missing');

          const visibleHtml = home.body.replace(/<script\b[\s\S]*?<\/script>/gi, '').replace(/<style\b[\s\S]*?<\/style>/gi, '').replace(/<!--[\s\S]*?-->/g, '');
          const cjkCount = (visibleHtml.match(/[\u3400-\u9fff]/g) || []).length;
          if (cjkCount > 0) throw new Error('English homepage source HTML contains ' + cjkCount + ' CJK characters outside scripts, styles and comments');
          if (!home.body.includes('content="IP Geolocation Lookup"')) throw new Error('English Open Graph site name missing');
          if (!home.body.includes('What can this IP lookup show?')) throw new Error('English IP lookup guide missing from source HTML');

          const networkLinks = [
            "https://www.digdevbox.com/",
            "https://img.digdevbox.com/",
            "https://play.digdevbox.com/",
            "https://draw.digdevbox.com/",
            "https://ttsreader.digdevbox.com/",
            "https://notes.digdevbox.com/"
          ];
          const missingNetworkLinks = networkLinks.filter((url) => !home.body.includes(url));
          if (missingNetworkLinks.length) throw new Error('Product discovery links missing: ' + missingNetworkLinks.join(', '));
          if (/href=["']https:\/\/(?:fangdai|geek-typing)\.digdevbox\.com\//i.test(home.body)) {
            throw new Error('Deferred China-only product link remains on the English site');
          }
          if (home.body.includes('href="https://digdevbox.com/')) throw new Error('Stale bare-domain internal link remains');
          
          const canonical = home.body.match(/<link[^>]+rel=["']canonical["'][^>]+href=["']([^"']+)/i)?.[1];
          if (canonical !== origin + '/') throw new Error('Unexpected homepage canonical: ' + canonical);
          if (!home.body.includes('role="main"')) throw new Error('Homepage main landmark is missing');
          const requiredInputLabels = ['IP address to look up', 'IP range in CIDR notation', 'Domain name or IP address for DNS lookup'];
          for (const label of requiredInputLabels) {
            if (!home.body.includes('aria-label="' + label + '"')) throw new Error('Missing accessible input label: ' + label);
          }
          if (!home.body.includes('"inLanguage": "en"')) throw new Error('English structured-data language missing');
          if (!home.body.includes('"priceCurrency": "USD"')) throw new Error('USD offer metadata missing');
          if (!home.body.includes('What can this IP lookup show?') || !home.body.includes('Data sources and accuracy') || !home.body.includes('Which IP address types are supported?')) {
            throw new Error('English IP lookup content and FAQ are missing from source HTML');
          }
          if (/<meta[^>]+name=["']robots["'][^>]+content=["'][^"']*noindex/i.test(home.body)) {
            throw new Error('Homepage unexpectedly carries noindex');
          }

          const landing = await get(landingPath);
          if (!landing.response.ok) throw new Error('English landing page returned HTTP ' + landing.response.status);
          if (!landing.body.includes('<html lang="en"')) throw new Error('English landing page source lang missing');
          const landingCanonical = landing.body.match(/<link[^>]+rel=["']canonical["'][^>]+href=["']([^"']+)/i)?.[1];
          if (landingCanonical !== origin + landingPath) throw new Error('Unexpected landing canonical: ' + landingCanonical);
          if (/<meta[^>]+name=["']robots["'][^>]+content=["'][^"']*noindex/i.test(landing.body)) {
            throw new Error('English landing page unexpectedly carries noindex');
          }

          const robots = await get('/robots.txt');
          if (!robots.response.ok || !/sitemap:\s*https:\/\//i.test(robots.body.toLowerCase()) ||
              !robots.body.toLowerCase().includes((origin + '/sitemap.xml').toLowerCase())) {
            throw new Error('robots.txt does not reference the canonical production sitemap');
          }

          let sitemap = null;
          for (let attempt = 1; attempt <= 20; attempt++) {
            const candidate = await get('/sitemap.xml');
            if (candidate.response.ok && candidate.body.includes('<urlset') &&
                candidate.body.includes(origin + landingPath)) {
              sitemap = candidate;
              console.log('Production sitemap includes the English landing page (attempt ' + attempt + ')');
              break;
            }
            console.log('Waiting for deployed sitemap (' + attempt + '/20): HTTP ' + candidate.response.status);
            await sleep(10000);
          }
          if (!sitemap) throw new Error('Production sitemap did not include the English landing page');

          // Chinese-only secondary pages are intentionally excluded from the US/EU index
          // until English source HTML is published. They remain crawlable for link discovery.
          const englishSupportPages = [
            { path: '/docs', heading: 'IP Address Documentation' },
            { path: '/guides', heading: 'IP Lookup Guides' },
            { path: '/faq', heading: 'Frequently Asked Questions' },
          ];
          for (const item of englishSupportPages) {
            const page = await get(item.path);
            if (!page.response.ok) throw new Error(item.path + ' returned HTTP ' + page.response.status);
            if (!page.body.includes('<html lang="en"')) throw new Error(item.path + ' must serve English source HTML');
            if (!page.body.includes(item.heading)) throw new Error(item.path + ' is missing its English content heading');
            if (!page.body.includes('role="main"')) throw new Error(item.path + ' is missing its main landmark');
            if (/<meta[^>]+name=["']robots["'][^>]+content=["'][^"']*noindex/i.test(page.body)) {
              throw new Error(item.path + ' unexpectedly carries noindex');
            }
            const canonical = page.body.match(/<link[^>]+rel=["']canonical["'][^>]+href=["']([^"']+)/i)?.[1];
            if (canonical !== origin + item.path) throw new Error(item.path + ' has an unexpected canonical: ' + canonical);
            if (!sitemap.body.includes(origin + item.path + '</loc>')) {
              throw new Error(item.path + ' is missing from the canonical sitemap');
            }
          }

          const excludedChinesePages = ['/about', '/contact', '/privacy', '/terms'];
          for (const path of excludedChinesePages) {
            const page = await get(path);
            if (!page.response.ok) throw new Error(path + ' should remain accessible (HTTP ' + page.response.status + ')');
            if (!/<meta[^>]+name=["']robots["'][^>]+content=["'][^"']*noindex\s*,?\s*follow/i.test(page.body)) {
              throw new Error(path + ' must carry noindex, follow until its English rewrite is published');
            }
            if (sitemap.body.includes(origin + path + '</loc>')) {
              throw new Error(path + ' must not appear in the indexable sitemap while noindexed');
            }
          }

          console.log('PASS: exact Cloudflare commit, English homepage, landing page, docs, guides and FAQ; canonical, sitemap and noindex policy for untranslated support pages');
          NODE