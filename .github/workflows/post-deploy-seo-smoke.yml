name: Post-deploy SEO smoke

on:
  workflow_run:
    workflows: ["verify"]
    types: [completed]

permissions:
  contents: read

jobs:
  production-smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wait for Cloudflare Git deployment and verify crawler-facing pages
        env:
          SITE_ORIGIN: "https://ip.digdevbox.com"
          LANDING_PATH: "/ip-geolocation/"
          EXPECTED_TITLE: "IP Geolocation Lookup"
        run: |
          node --input-type=module <<'NODE'
          const origin = process.env.SITE_ORIGIN;
          const landingPath = process.env.LANDING_PATH;
          const expectedTitle = process.env.EXPECTED_TITLE;
          const ua = 'Googlebot/2.1 (+http://www.google.com/bot.html)';
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function get(url) {
            const response = await fetch(url, {
              redirect: 'follow',
              headers: { 'user-agent': ua, 'cache-control': 'no-cache' },
            });
            return { response, body: await response.text() };
          }

          let homepage = null;
          for (let attempt = 1; attempt <= 20; attempt++) {
            try {
              const result = await get(origin + '/');
              const title = result.body.match(/<title[^>]*>([\\s\\S]*?)<\\/title>/i)?.[1] || '';
              if (result.response.ok && result.body.includes('<html lang="en"') && title.includes(expectedTitle)) {
                homepage = result;
                console.log(`Production homepage updated and crawler-readable (attempt ${attempt})`);
                break;
              }
              console.log(`Waiting for production deployment (${attempt}/20): HTTP ${result.response.status}, title="${title}"`);
            } catch (error) {
              console.log(`Waiting for production origin (${attempt}/20): ${error.message}`);
            }
            await sleep(15000);
          }
          if (!homepage) throw new Error('Production homepage did not expose the expected English HTML within 5 minutes');

          const canonical = homepage.body.match(/<link[^>]+rel=["']canonical["'][^>]+href=["']([^"']+)/i)?.[1];
          if (canonical !== origin + '/') throw new Error(`Unexpected homepage canonical: ${canonical}`);
          if (!homepage.body.includes('"inLanguage": "en"')) throw new Error('English structured-data language missing');
          if (!homepage.body.includes('"priceCurrency": "USD"')) throw new Error('USD offer metadata missing');

          const landing = await get(origin + landingPath);
          if (!landing.response.ok) throw new Error(`English landing page returned HTTP ${landing.response.status}`);
          if (!landing.body.includes('lang="en"')) throw new Error('English landing page lang attribute missing');
          if (!landing.body.includes('rel="canonical"')) throw new Error('English landing page canonical missing');

          const robots = await get(origin + '/robots.txt');
          if (!robots.response.ok || !/Sitemap:\\s*https:\\/\\//i.test(robots.body)) {
            throw new Error('robots.txt missing an absolute HTTPS Sitemap directive');
          }

          const sitemap = await get(origin + '/sitemap.xml');
          if (!sitemap.response.ok || !sitemap.body.includes(origin + landingPath)) {
            throw new Error('sitemap.xml missing the English landing page URL');
          }

          console.log('PASS: homepage metadata, canonical, structured data, English landing page, robots.txt and sitemap.xml');
          NODE
