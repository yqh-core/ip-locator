name: verify

# 只做质量门禁，不负责发布。
# 发布由 Cloudflare Pages 的 Git 集成负责（push main 即自动构建上线）。
# 两条链路职责不重叠 —— Actions 答"能不能发"，Cloudflare 答"发"。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: 校验 locale 配平（G2）
        run: node scripts/check-locales.mjs

      - name: 校验 IP V1 商业口径（G3 文案限定语 / 接入类型断言禁令 / network_type 全链路）
        run: node scripts/check-copy-policy.mjs

      - name: CIDR / IPv4 / IPv6 / DNS 纯逻辑单元测试
        run: node --test tests/net-tools.test.mjs

      - name: 首页移动端任务入口布局回归
        run: node --test tests/homepage-layout.test.mjs

      - name: Mobile cross-site navigation scroll affordance regression
        run: node --test tests/shell-mobile-nav.test.mjs

      - name: GA4 consent 静态门禁（ID / 页面覆盖 / 隐私边界）
        run: node scripts/check-ga4-consent.mjs

      - name: GA4 consent 运行时回归（同意 / 拒绝 / noindex / 撤回）
        run: node scripts/test-ga4-consent-runtime.mjs

      - name: 组装发布目录
        run: node scripts/build.mjs

      - name: GA4 consent 发布产物门禁
        run: |
          set -euo pipefail
          test -s dist/analytics-consent.js
          for page in index.html ip-geolocation/index.html about.html contact.html docs.html faq.html guides.html privacy.html terms.html; do
            grep -Fq '/analytics-consent.js' "dist/$page"
          done
          if grep -Fq '/analytics-consent.js' dist/404.html; then
            echo "::error::404 must not load GA4 consent or emit page_view"
            exit 1
          fi
          echo "PASS: consent loader and all nine public HTML pages are present in the production artifact"

      - name: 验证英文 IP 落地页与 sitemap 已进入产物
        run: |
          set -euo pipefail
          test -f dist/ip-geolocation/index.html
          grep -q 'https://ip.digdevbox.com/ip-geolocation/' dist/sitemap.xml
          grep -q 'lang="en"' dist/ip-geolocation/index.html
          echo "English IP landing page and sitemap entry verified"

      - name: SEO sitemap 与 indexability 产物契约
        run: |
          node scripts/check-seo-artifacts.mjs --self-test
          node scripts/check-seo-artifacts.mjs dist

      - name: 校验产物内容
        run: |
          set -euo pipefail

          test -f dist/index.html || { echo "::error::dist/index.html 缺失"; exit 1; }

          # 根目录没有 404.html 时 Pages 会按 SPA 兜底：未知路径返回 200 + index.html，
          # 形成软 404，搜索引擎会收录一堆空壳页。这里把它变成硬性检查。
          test -f dist/404.html || { echo "::error::dist/404.html 缺失（Pages 会软 404 兜底）"; exit 1; }

          # 仓库元文件不该被当成静态资源发出去
          for f in README.md LICENSE CNAME .gitignore .gitattributes .nvmrc; do
            if [ -e "dist/$f" ]; then
              echo "::error::$f 不该出现在发布产物里"
              exit 1
            fi
          done

          echo "产物文件数: $(find dist -type f | wc -l)"

      # 这一步是便利项，不是门禁。
      # 实测 GitHub 的 artifacts 后端会偶发失败：
      #   ##[error]Failed to FinalizeArtifact: Received non-retryable error:
      #   Failed request: (403) Forbidden: Error from intermediary
      # 产物内容其实已上传成功，卡在最后的 Finalize 阶段；配额也正常
      # （全账号 artifacts 合计仅约 12 MiB），同一步骤在其他仓库能成功。
      # 这种后端抖动不该把仓库标红。真门禁是上面那两步。
      - name: 上传产物（便于人工核对）
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

      # SEO regression guard: the initial server HTML must describe the English product,
      # not rely on JavaScript to replace a Chinese fallback before a crawler can understand it.
      - name: SEO 首页英文源 HTML 门禁（metadata + structured data）
        run: |
          set -euo pipefail
          grep -Fq '<html lang="en" data-i18n-page="home">' index.html
          grep -Fq '<title>IP Geolocation Lookup' index.html
          grep -Fq 'name="description" content="Look up public IPv4 and IPv6 addresses' index.html
          grep -Fq 'property="og:locale" content="en_US"' index.html
          grep -Fq '"inLanguage": "en"' index.html
          grep -Fq '"priceCurrency": "USD"' index.html
          echo "English-first IP homepage metadata and structured data verified"
