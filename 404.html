<html lang="zh-CN">
<head>

    <title>404 页面不存在 - IP归属地查询工具</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .notfound { text-align: center; padding: 64px 24px; }
        .notfound .code { font-size: 72px; font-weight: 700; color: #1877f2; line-height: 1; margin: 0; }
        .notfound h1 { font-size: 20px; margin: 20px 0 8px; }
        .notfound p { color: #65676b; font-size: 15px; line-height: 1.8; margin: 0 0 28px; }
        .notfound .btn { display: inline-block; padding: 10px 26px; background: #1877f2; color: #fff;
                         text-decoration: none; border-radius: 6px; font-size: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <nav class="top-nav">
            <ul>
                <li><a href="index.html">首页</a></li>
                <li><a href="about.html">关于</a></li>
            </ul>
        </nav>
        <div class="notfound">
            <p class="code">404</p>
            <h1>页面不存在</h1>
            <p>你访问的地址已被移除或从未存在过。<br>请检查链接是否拼写正确。</p>
